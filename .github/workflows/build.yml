name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Both jobs only read the repo and upload artifacts; artifact upload uses the
# runner's own token, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  bundle:
    name: Claude Desktop bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build and pack
        run: pnpm run bundle

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: forecast-mcpb
          path: forecast.mcpb
          retention-days: 90

  docker:
    name: Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Build Docker image
        run: docker build -t forecast-mcp .

      - name: Export Docker image
        run: docker save forecast-mcp | gzip > forecast-mcp.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v7
        with:
          name: forecast-mcp-docker-image
          path: forecast-mcp.tar.gz
          retention-days: 7
